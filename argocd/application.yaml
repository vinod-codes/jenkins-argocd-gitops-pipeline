apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vinod-codes/jenkins-argocd-gitops-pipeline.git
    targetRevision: HEAD
    # ArgoCD tracks the Helm chart in this repository. Jenkins updates
    # helm/app-chart/values.yaml (image.tag) after each successful build,
    # and ArgoCD syncs that change into the cluster automatically.
    path: helm/app-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      # Prune resources that were removed from Git; self-heal any manual
      # change made directly in the cluster back to the Git state.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
