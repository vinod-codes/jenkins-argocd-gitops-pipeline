<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <!-- No external CSS: the page is styled entirely by /css/main.css, so it
         renders the same with no internet access. -->
    <link data-th-href="@{/css/main.css}" rel="stylesheet">
    <title>GitOps Demo</title>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">GitOps Demo — Jenkins, SonarQube, Argo CD</a>
</nav>

<main role="main" class="container">
    <div class="starter-template">
        <h1 th:text="${title}">Default title.</h1>
        <p th:text="${msg}">Default text.</p>
        <p>App version: <span th:text="${version}">1.0.0</span></p>
        <p><a href="/health">Health check</a> &middot; <a href="/api/greet?name=Vinod">Greeting API</a></p>
    </div>
</main>

</body>

</html>
