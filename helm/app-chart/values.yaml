# Default values for app-chart.
# Override these with your own values file or --set flags. Jenkins updates
# image.tag automatically after a successful build (see Jenkinsfile).

replicaCount: 2

image:
  repository: docker.io/vinodg/gitops-demo
  pullPolicy: IfNotPresent
  # NOTE: the tag is updated by Jenkins to the git short SHA of each build.
  # The default here (1.0.0) matches the application version in app/pom.xml.
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
