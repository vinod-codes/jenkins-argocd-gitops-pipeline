<text x="16" y="301" fill="#c9d1d9">    &lt;link href="/css/main.css" rel="stylesheet"&gt;</text>
<text x="16" y="320" fill="#c9d1d9">    &lt;title&gt;GitOps Demo&lt;/title&gt;</text>
