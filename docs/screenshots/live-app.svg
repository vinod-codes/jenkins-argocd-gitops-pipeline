<text x="72" y="18" fill="#8b949e" font-size="12">gitops-demo running locally — live curl checks</text>
<text x="16" y="28" fill="#7ee787" font-weight="bold">$ java -jar app/target/gitops-demo-1.0.0.jar</text>
<text x="16" y="54" fill="#c9d1d9">$ curl -s http://localhost:8080/health</text>
<text x="16" y="73" fill="#c9d1d9">{"app":"gitops-demo","version":"1.0.0","status":"UP"}</text>
<text x="16" y="92" fill="#c9d1d9">HTTP 200</text>
<text x="16" y="111" fill="#c9d1d9">$ curl -s "http://localhost:8080/api/greet?name=Vinod"</text>
<text x="16" y="130" fill="#c9d1d9">{"message":"Hello, Vinod! Welcome to the GitOps demo."}</text>
<text x="16" y="149" fill="#c9d1d9">HTTP 200</text>
<text x="16" y="168" fill="#c9d1d9">$ curl -s http://localhost:8080/ | head -c 300</text>
<text x="16" y="187" fill="#c9d1d9">&lt;!DOCTYPE html&gt;</text>
